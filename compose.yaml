x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: mibici-service:local

services:
  registry-init:
    <<: *app
    command: ["python", "/app/scripts/compose/seed_mlflow_store.py"]
    volumes:
      - type: bind
        source: ${MODEL_STORE_PATH:-./.model-store}
        target: /seed
        read_only: true
      - mlflow-backend:/mlflow/backend
      - mlflow-artifacts:/mlflow/artifacts
    restart: "no"

  mlflow:
    <<: *app
    depends_on:
      registry-init:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-backend:/mlflow/backend
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      P1_MODEL_URI: "models:/mibici-equipo29-p1-demanda@champion"
      P2_MODEL_URI: "models:/mibici-equipo29-p2-riesgo@champion"
      P3_MODEL_URI: "models:/mibici-equipo29-p3-grupos@champion"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:8.8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  p2-worker:
    <<: *app
    command:
      - rq
      - worker
      - --url
      - redis://redis:6379/0
      - --worker-class
      - rq.worker.SimpleWorker
      - p2
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      P2_MODEL_URI: "models:/mibici-equipo29-p2-riesgo@champion"
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; from redis import Redis; from rq import Worker; sys.exit(not Worker.all(connection=Redis(host='redis')))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  mlflow-backend:
  mlflow-artifacts: