x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: mibici-service:local

services:
  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --default-artifact-root
      - mlflow-artifacts:/
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-backend:/mlflow/backend
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      P1_MODEL_URI: "models:/mibici-equipo29-p1-demanda@champion"
      P3_MODEL_URI: "models:/mibici-equipo29-p3-grupos@champion"
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-backend:
  mlflow-artifacts: